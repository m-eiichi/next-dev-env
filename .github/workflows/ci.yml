# Pull Request と main への push で、Lint・型チェック・テスト・ビルドを実行する
# 実行するものと設定の理由は docs/02_共通設計/11_CI.md を参照
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しく push されたら、実行中のものは止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint / 型チェック / テスト / ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # pnpm のバージョンは package.json の packageManager に合わせる
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # .devcontainer/Dockerfile の node:24 と合わせる
          cache: pnpm

      - name: 依存パッケージのインストール
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: ファイル名のチェック
        run: pnpm lint:ls

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト（カバレッジの目標も確認する）
        run: pnpm test:coverage

      - name: ビルド
        run: pnpm build

  knip:
    name: 未使用コードの検出（参考）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 導入したライブラリをまだ使っていない段階では失敗するため、結果は参考にとどめる。
    # コードがそろってきたら continue-on-error を外し、必須にする
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm knip
